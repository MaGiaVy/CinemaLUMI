services:
  # 1. Cơ sở Dữ liệu PostgreSQL Local (Thay thế hoàn toàn Supabase Cloud)
  postgres:
    image: postgres:16-alpine
    container_name: lumicinema_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lumicinema
    ports:
      - "5434:5432"
    volumes:
      - lumicinema_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumicinema"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Giao diện Web quản trị CSDL trực quan (Tùy chọn - Giống hệt Supabase Table Editor)
  adminer:
    image: adminer:latest
    container_name: lumicinema_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Ứng Dụng Web Lumi Cinema (Next.js 16 Production Container)
  web:
    build:
      context: ./cinema-app
      dockerfile: Dockerfile
    container_name: lumicinema_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./cinema-app/.env
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/lumicinema?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/lumicinema?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "lumicinema_cosmic_galaxy_secret_key_2026"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "giavyma265@gmail.com"
      SMTP_PASSWORD: "dzqexmgcvlzgcrvi"
      EMAIL_FROM: "LUMI CINEMA <lumi_cinema@gmail.com>"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lumicinema_pgdata:
    driver: local
